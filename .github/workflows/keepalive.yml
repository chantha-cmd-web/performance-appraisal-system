name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sS -o /dev/null -w "%{http_code}\n" https://performance-appraisal-system-api.onrender.com/api/health
