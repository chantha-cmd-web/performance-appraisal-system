# apphosting.yaml
# Configuration file for Firebase App Hosting
# Documents resource allocation and environment variables for deployment.

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 80

env:
  # Environment variables. You can bind these to Secret Manager keys in Firebase console 
  # or define them as simple environment variables in your Firebase App Hosting dashboard.
  - variable: JWT_SECRET
    availability: [ RUNTIME ]
  - variable: GOOGLE_APPS_SCRIPT_URL
    availability: [ RUNTIME ]
  - variable: GOOGLE_APPS_SCRIPT_SECRET
    availability: [ RUNTIME ]
  - variable: DATABASE_URL
    availability: [ RUNTIME ]
