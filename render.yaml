services:
  - type: web
    name: performance-appraisal-system-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
